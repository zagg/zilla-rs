[package]
name = "zilla-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Zilla-RS : client FTP/FTPS/SFTP/FTP over TLS multi-panes, clone web autonome de FileZilla, en Rust"
license = "MIT"
authors = ["Zilla-RS project"]
repository = "https://github.com/zagg/zilla-rs"
homepage = "https://github.com/zagg/zilla-rs"
readme = "README.md"
keywords = ["ftp", "sftp", "filezilla", "web", "transfer"]
categories = ["network-programming", "web-programming"]

[[bin]]
name = "zilla"
path = "src/main.rs"

[lib]
name = "zilla_rs"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.54", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
percent-encoding = "2"
arc-swap = "1"
rand = "0.9"
hex = "0.4"
pathdiff = "0.2"
async-trait = "0.1"
mime_guess = "2"
urlencoding = "2"
base64 = "0.22"
roxmltree = "0.20"
unicode-normalization = "0.1"
tokio-util = { version = "0.7", features = ["io"] }

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12", "logging"]

[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring", "logging", "tls12"]

[dependencies.russh]
version = "0.64"
default-features = false
features = ["ring", "flate2", "rsa", "async-trait"]

[dependencies.russh-sftp]
version = "3"

[dependencies.webpki-roots]
version = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
